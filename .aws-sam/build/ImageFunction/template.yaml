AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Resources:
  # ============================================================
  # S3
  # ============================================================
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: image-bucket

  # ============================================================
  # DynamoDB
  # ============================================================
  ImageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: images
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ============================================================
  # Lambda
  # ============================================================
  ImageFunction:
    Type: AWS::Serverless::Function

    Properties:
      Runtime: python3.12
      Handler: src.handler.api_handler
      CodeUri: .
      Timeout: 30

      Environment:
        Variables:
          BUCKET_NAME: image-bucket
          IMAGE_PATH: image/
          AWS_BASE_URL: http://host.docker.internal:4566
          AWS_REGION: ap-south-1
          IMAGE_TABLE: images

      Policies:
        - DynamoDBCrudPolicy:
            TableName: images
        - S3CrudPolicy:
            BucketName: image-bucket

      Events:
        # ======================================================
        # Upload
        # ======================================================
        ImageApi:
          Type: Api
          Properties:
            Path: /upload-image
            Method: POST

        # ======================================================
        # List
        # ======================================================
        ListApi:
          Type: Api
          Properties:
            Path: /list-images
            Method: GET

        # ======================================================
        # Get Download Url
        # ======================================================
        PreSignedUrlApi:
          Type: Api
          Properties:
            Path: /get-download-url
            Method: GET

        # ======================================================
        # Delete
        # ======================================================
        DeleteApi:
          Type: Api
          Properties:
            Path: /delete-image
            Method: DELETE
